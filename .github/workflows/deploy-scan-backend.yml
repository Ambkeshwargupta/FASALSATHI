name: Deploy FASALSATHI database and Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required repository secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CROP_HEALTH_API_KEY: ${{ secrets.CROP_HEALTH_API_KEY }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_DB_URL CROP_HEALTH_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Check out FASALSATHI
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check both Edge Functions
        run: |
          deno check supabase/functions/rapid-endpoint/index.ts
          deno check supabase/functions/disease-reports/index.ts

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the dedicated Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "aaslgfnfdxhgoqwwpgnz" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations over IPv4-compatible session pooler
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Set server-side Crop.health secret
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CROP_HEALTH_API_KEY: ${{ secrets.CROP_HEALTH_API_KEY }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/fasalsathi-edge-secrets.env"
          umask 077
          printf 'CROP_HEALTH_API_KEY=%s\n' "$CROP_HEALTH_API_KEY" > "$SECRETS_FILE"
          supabase secrets set --env-file "$SECRETS_FILE" --project-ref "aaslgfnfdxhgoqwwpgnz"
          rm -f "$SECRETS_FILE"

      - name: Deploy Crop.health scanner
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy rapid-endpoint --project-ref "aaslgfnfdxhgoqwwpgnz" --no-verify-jwt

      - name: Deploy private disease reports service
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy disease-reports --project-ref "aaslgfnfdxhgoqwwpgnz" --no-verify-jwt
