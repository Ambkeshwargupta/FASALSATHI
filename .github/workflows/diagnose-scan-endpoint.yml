name: Diagnose crop photo service

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-scan-endpoint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the configured Supabase project hostname
        shell: bash
        run: |
          set -euo pipefail
          HOST="cyopgofpflgnhzgmvynb.supabase.co"
          echo "=== DNS-over-HTTPS lookup: $HOST ==="
          curl --fail --silent --show-error --max-time 20 \
            "https://dns.google/resolve?name=$HOST&type=A" | jq '{Status,Answer,Comment}'
          echo "=== Runner resolver lookup ==="
          getent ahosts "$HOST" || true
      - name: Check Supabase function CORS preflight for both deployments
        shell: bash
        run: |
          set -u
          ENDPOINT="https://cyopgofpflgnhzgmvynb.supabase.co/functions/v1/rapid-endpoint"
          for ORIGIN in "https://newcoder355.github.io" "https://ambkeshwargupta.github.io"; do
            echo "=== CORS preflight: $ORIGIN ==="
            curl --silent --show-error --max-time 25 \
              --dump-header /tmp/headers --output /tmp/body \
              --write-out "HTTP_STATUS=%{http_code}\n" \
              --request OPTIONS "$ENDPOINT" \
              --header "Origin: $ORIGIN" \
              --header "Access-Control-Request-Method: POST" \
              --header "Access-Control-Request-Headers: apikey,content-type" || true
            grep -iE "^(HTTP/|access-control-allow-origin:|access-control-allow-methods:|access-control-allow-headers:|vary:)" /tmp/headers 2>/dev/null || true
            echo
          done
