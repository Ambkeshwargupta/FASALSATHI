name: Diagnose FASALSATHI scan connection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-scan-endpoint.yml"
      - "app-config.js"
      - "supabase/functions/rapid-endpoint/index.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase project DNS
        shell: bash
        run: |
          set -euo pipefail
          HOST="aaslgfnfdxhgoqwwpgnz.supabase.co"
          echo "=== Google DNS lookup ==="
          curl --fail --silent --show-error --max-time 20 \
            "https://dns.google/resolve?name=$HOST&type=A" | jq '{Status,Answer,Comment}'
          echo "=== GitHub runner resolver ==="
          getent ahosts "$HOST"

      - name: Check Supabase REST API and scanner preflight
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://aaslgfnfdxhgoqwwpgnz.supabase.co"
          echo "=== Supabase REST endpoint reachability ==="
          curl --silent --show-error --max-time 25 \
            --output /tmp/rest-body --dump-header /tmp/rest-headers \
            --write-out "REST_HTTP_STATUS=%{http_code}\n" \
            "$BASE/rest/v1/"
          head -n 1 /tmp/rest-headers || true
          echo "=== rapid-endpoint CORS preflight ==="
          curl --silent --show-error --max-time 25 \
            --output /tmp/scan-body --dump-header /tmp/scan-headers \
            --write-out "SCAN_OPTIONS_HTTP_STATUS=%{http_code}\n" \
            --request OPTIONS "$BASE/functions/v1/rapid-endpoint" \
            --header "Origin: https://ambkeshwargupta.github.io" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: apikey,content-type"
          grep -iE "^(HTTP/|access-control-allow-origin:|access-control-allow-methods:|access-control-allow-headers:|vary:)" /tmp/scan-headers || true
          echo "=== response body ==="
          head -c 800 /tmp/scan-body || true
